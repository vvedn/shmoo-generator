name: AutoShmoo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Lint with ruff
        run: ruff check autoshmoo/ tests/

      - name: Run tests
        run: pytest --tb=short -v

      - name: Generate shmoo plots from sample reports
        run: python -m autoshmoo examples/sample_project/reports outputs

      - name: Upload shmoo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shmoo-outputs
          path: outputs/

      - name: Commit generated outputs to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --cached --quiet || git commit -m "ci: update generated shmoo plots and summaries"
          git push
